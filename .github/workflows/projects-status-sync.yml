# Copies each issue and PR on the product projects into the 🚀 Airship Labs
# roll-up project, with its Status. First, on the source projects, it moves
# issues with an open, non-draft linked PR to In review (and back to In
# progress when all their open linked PRs are drafts); that Status is the only
# thing it writes there. Script: scripts/projects-status-sync.mjs
name: Projects status sync

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only read and log what would change"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: projects-status-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write # keepalive step below
    env:
      ROLLUP_PROJECT_NUMBER: "19" # 🚀 Airship Labs (not #8, the old project)
      # 💌 Sendable Cards, ⛏️ Groom Reaper, ✏️ Sketch It, ⛲ FeatureFountain, 🐛 BugBeacon, ☂️ Yumbrella
      SOURCE_PROJECT_NUMBERS: "5,10,12,13,14,15"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node scripts/projects-status-sync.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.PROJECTS_SYNC_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run == true }}
      # Keepalive: GitHub disables scheduled workflows in public repos after
      # 60 days without repo activity. Re-enabling on every run resets that.
      - name: Keep the schedule enabled
        if: always()
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/projects-status-sync.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
