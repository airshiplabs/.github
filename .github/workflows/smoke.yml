# Reusable production smoke test.
#
# Callers pass base_url (the real prod domain, never a deployment URL) and
# app_name, and own playwright.smoke.config.ts plus a `test:smoke` script with
# Playwright projects `signed-out` and `signed-in`.
#
# signed_in: false (default) runs the signed-out project with no secrets.
# signed_in: true runs the signed-in project in `environment` (e.g. smoke-prod).
#   Its per-repo environment secrets SMOKE_GH_USER, SMOKE_GH_PASSWORD and
#   SMOKE_GH_TOTP_SECRET are read by that job directly (environment secrets
#   can't be passed by the caller). If they're missing, the tests skip.
#
# Security: never call this from pull_request_target. Only `contents: read` by
# default; `issues: write` only on the report job. No traces, videos, HTML
# report or storageState are uploaded; failure screenshots only.
name: Production smoke test

on:
  workflow_call:
    inputs:
      base_url:
        type: string
        required: true
      app_name:
        type: string
        required: false
        default: ""
      signed_in:
        type: boolean
        required: false
        default: false
      environment:
        type: string
        required: false
        default: smoke-prod

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.repository }}-${{ inputs.signed_in }}
  cancel-in-progress: false

jobs:
  signed-out:
    if: ${{ !inputs.signed_in }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps: &steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect package manager
        id: pm
        run: |
          if [ -f bun.lock ] || [ -f bun.lockb ]; then echo "pm=bun" >> "$GITHUB_OUTPUT"; else echo "pm=npm" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ${{ steps.pm.outputs.pm == 'npm' && 'npm' || '' }}

      - if: steps.pm.outputs.pm == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - if: steps.pm.outputs.pm == 'bun'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        env:
          PM: ${{ steps.pm.outputs.pm }}
        run: if [ "$PM" = bun ]; then bun install --frozen-lockfile; else npm ci; fi

      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        env:
          HIT: ${{ steps.pw-cache.outputs.cache-hit }}
        run: |
          if [ "$HIT" = true ]; then npx playwright install-deps chromium; else npx playwright install --with-deps chromium; fi

      - name: Run smoke tests
        env:
          PM: ${{ steps.pm.outputs.pm }}
          PROJECT: ${{ inputs.signed_in && 'signed-in' || 'signed-out' }}
          SMOKE_BASE_URL: ${{ inputs.base_url }}
          SMOKE_GH_USER: ${{ inputs.signed_in && secrets.SMOKE_GH_USER || '' }}
          SMOKE_GH_PASSWORD: ${{ inputs.signed_in && secrets.SMOKE_GH_PASSWORD || '' }}
          SMOKE_GH_TOTP_SECRET: ${{ inputs.signed_in && secrets.SMOKE_GH_TOTP_SECRET || '' }}
        run: |
          if [ "$PM" = bun ]; then bun run test:smoke --project="$PROJECT"; else npm run test:smoke -- --project="$PROJECT"; fi

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-screenshots-${{ inputs.signed_in && 'signed-in' || 'signed-out' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 14

  signed-in:
    if: ${{ inputs.signed_in }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    steps: *steps

  report:
    needs: [signed-out, signed-in]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          APP_NAME: ${{ inputs.app_name || github.event.repository.name }}
          BASE_URL: ${{ inputs.base_url }}
          MODE: ${{ inputs.signed_in && 'signed-in' || 'signed-out' }}
          RESULT: ${{ inputs.signed_in && needs.signed-in.result || needs.signed-out.result }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const { APP_NAME, BASE_URL, MODE, RESULT } = process.env;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const label = "smoke-failure";
            const title = `Production smoke test failing: ${APP_NAME} (${MODE})`;
            const open = (await github.paginate(github.rest.issues.listForRepo, { owner, repo, labels: label, state: "open" }))
              .filter((i) => i.title === title);
            if (RESULT === "success") {
              for (const issue of open) {
                await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: `Smoke test (${MODE}) is green again: ${runUrl}` });
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: "closed", state_reason: "completed" });
              }
              return;
            }
            if (RESULT !== "failure") return;
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (e) {
              if (e.status !== 404) throw e;
              await github.rest.issues.createLabel({ owner, repo, name: label, color: "d73a4a", description: "Production smoke test is failing" });
            }
            const body = `Smoke test (${MODE}) failed against ${BASE_URL} (${context.eventName}): ${runUrl}`;
            if (open.length) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open[0].number, body });
            } else {
              await github.rest.issues.create({ owner, repo, labels: [label], title,
                body: `${body}\n\nFailure screenshots are attached to the run. This issue closes itself on the next green ${MODE} run.` });
            }
